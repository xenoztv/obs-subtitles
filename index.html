<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sous-titres temps réel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 80px;
    overflow: hidden;
  }

  body.preview { background: #00b140; }

  #subtitle-box { width: 88%; text-align: center; }

  #current-line {
    display: inline-block;
    font-family: 'Montserrat', 'Arial Black', sans-serif;
    font-size: 64px;
    font-weight: 900;
    line-height: 1.15;
    color: #ffffff;
    text-align: center;
    -webkit-text-stroke: 6px #000000;
    paint-order: stroke fill;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    word-break: keep-all;
    min-height: 1em;
  }

  .word-span {
    display: inline;
    animation: popIn 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.75); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div id="subtitle-box">
  <div id="current-line"></div>
</div>

<script>
  const lineEl = document.getElementById("current-line");
  const WORDS_PER_LINE = 3;
  const COLOR_TEXT     = "#ffffff";
  const COLOR_ACTIVE   = "#FF8C00";   // Orange clair
  const STROKE         = "6px #000000";

  if (window.location.search.includes("preview")) {
    document.body.classList.add("preview");
  }

  let confirmedWords = [];
  let clearTimer     = null;
  let lastFinalIndex = -1;   // Pour éviter les doublons

  function renderWords(confirmed, interim) {
    const lineWords = confirmed.slice(-WORDS_PER_LINE);
    const allWords  = [...lineWords, ...interim];

    lineEl.innerHTML = "";
    allWords.forEach((word, i) => {
      const span     = document.createElement("span");
      span.className = "word-span";
      // Dernier mot confirmé = orange, interim = blanc semi-transparent
      if (i >= lineWords.length) {
        span.style.color   = COLOR_TEXT;
        span.style.opacity = "0.5";
      } else if (i === lineWords.length - 1) {
        span.style.color = COLOR_ACTIVE;
      } else {
        span.style.color = COLOR_TEXT;
      }
      span.textContent = (i === 0 ? "" : " ") + word;
      lineEl.appendChild(span);
    });

    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => {
      lineEl.style.transition = "opacity 0.6s";
      lineEl.style.opacity    = "0";
      setTimeout(() => {
        confirmedWords      = [];
        lastFinalIndex      = -1;
        lineEl.innerHTML    = "";
        lineEl.style.opacity    = "1";
        lineEl.style.transition = "";
      }, 600);
    }, 3500);
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SR) {
    lineEl.style.color            = "red";
    lineEl.style.fontSize         = "20px";
    lineEl.style.webkitTextStroke = "0px";
    lineEl.textContent            = "Navigateur non supporté — utilise Chrome";
  } else {
    const recognition           = new SR();
    recognition.lang            = "fr-FR";
    recognition.continuous      = true;
    recognition.interimResults  = true;
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
      let interimWords = [];

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        const words  = result[0].transcript.trim().split(/\s+/).filter(Boolean);

        if (result.isFinal) {
          // Évite de traiter deux fois le même résultat final
          if (i > lastFinalIndex) {
            lastFinalIndex = i;
            confirmedWords.push(...words);
          }
          interimWords = [];
        } else {
          interimWords = words;
        }
      }

      renderWords(confirmedWords, interimWords);
    };

    recognition.onerror = (e) => {
      if (e.error !== "no-speech") setTimeout(() => recognition.start(), 1000);
    };

    recognition.onend = () => setTimeout(() => recognition.start(), 200);
    recognition.start();
  }
</script>
</body>
</html>
