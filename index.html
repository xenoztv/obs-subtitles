<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sous-titres temps réel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 80px;
    overflow: hidden;
  }
  body.preview { background: #00b140; }
  #line {
    display: inline-block;
    font-family: 'Montserrat', 'Arial Black', sans-serif;
    font-size: 64px;
    font-weight: 900;
    line-height: 1.2;
    text-align: center;
    -webkit-text-stroke: 6px #000;
    paint-order: stroke fill;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    word-break: keep-all;
  }
  .w        { display: inline; color: #fff; }
  .w.active { color: #FF8C00; }
  .w.dim    { color: #fff; opacity: 0.5; }
</style>
</head>
<body>
<div style="width:88%;text-align:center">
  <div id="line"></div>
</div>
<script>
  if (location.search.includes("preview")) document.body.classList.add("preview");

  const el  = document.getElementById("line");
  const MAX = 3;

  let buffer    = [];   // mots finaux accumulés
  let lastFinal = -1;
  let silTimer  = null;

  function render(words, interim) {
    el.innerHTML = "";
    const all = [...words, ...interim];
    all.forEach((w, i) => {
      const s = document.createElement("span");
      s.className = "w" +
        (i >= words.length    ? " dim"    :
         i === words.length-1 ? " active" : "");
      s.textContent = (i ? " " : "") + w;
      el.appendChild(s);
    });
  }

  function scheduleClear() {
    // Efface seulement après 1.5s de silence total — pas de clignotement
    clearTimeout(silTimer);
    silTimer = setTimeout(() => {
      el.innerHTML = "";
      buffer = [];
    }, 1500);
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { el.textContent = "Utilise Chrome"; }
  else {
    const r = new SR();
    r.lang = "fr-FR";
    r.continuous = true;
    r.interimResults = true;

    r.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const words = e.results[i][0].transcript.trim().split(/\s+/).filter(Boolean);

        if (e.results[i].isFinal) {
          if (i <= lastFinal) continue;
          lastFinal = i;
          clearTimeout(silTimer); // annule l'effacement pendant qu'on parle

          for (const w of words) {
            buffer.push(w);
            if (buffer.length >= MAX) {
              // Groupe plein : affiche et repart à zéro SANS passer par le vide
              render([...buffer], []);
              buffer = [];
            }
          }
          if (buffer.length > 0) render([...buffer], []);
          scheduleClear(); // démarre le timer de silence

        } else {
          clearTimeout(silTimer);
          render([...buffer], words);
        }
      }
    };

    r.onerror = e => { if (e.error !== "no-speech") setTimeout(() => r.start(), 800); };
