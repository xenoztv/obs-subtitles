<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sous-titres temps réel</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 80px;
    overflow: hidden;
  }
  body.preview { background: #00b140; }
  #line {
    display: inline-block;
    font-family: 'Montserrat', 'Arial Black', sans-serif;
    font-size: 64px;
    font-weight: 900;
    line-height: 1.2;
    text-align: center;
    -webkit-text-stroke: 6px #000;
    paint-order: stroke fill;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    word-break: keep-all;
    opacity: 1;
    transition: opacity 0.3s;
  }
  .w { display: inline; color: #fff; }
  .w.active { color: #FF8C00; }
  .w.interim { color: #fff; opacity: 0.5; }
</style>
</head>
<body>
<div style="width:88%;text-align:center">
  <div id="line"></div>
</div>
<script>
  if (location.search.includes("preview")) document.body.classList.add("preview");

  const el   = document.getElementById("line");
  const MAX  = 3;       // mots par groupe
  const WAIT = 100;    // ms silence avant effacement

  let shown      = [];   // mots affichés dans le groupe courant
  let clearTimer = null;

  function show(words, interim) {
    el.innerHTML = "";
    [...words, ...interim].forEach((w, i) => {
      const s = document.createElement("span");
      s.className = "w" +
        (i >= words.length   ? " interim" :
         i === words.length-1 ? " active"  : "");
      s.textContent = (i ? " " : "") + w;
      el.appendChild(s);
    });
    el.style.opacity = "1";
    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => {
      el.style.opacity = "0";
      setTimeout(() => { el.innerHTML = ""; shown = []; }, 300);
    }, WAIT);
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { el.textContent = "Utilise Chrome"; el.style.color = "red"; }
  else {
    const r = new SR();
    r.lang = "fr-FR";
    r.continuous = true;
    r.interimResults = true;

    let lastFinal = -1;

    r.onresult = e => {
      let interim = [];
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const words = e.results[i][0].transcript.trim().split(/\s+/).filter(Boolean);
        if (e.results[i].isFinal) {
          if (i <= lastFinal) continue;
          lastFinal = i;
          for (const w of words) {
            shown.push(w);
            if (shown.length >= MAX) {
              show([...shown], []);
              // Repart à zéro après un court délai
              setTimeout(() => { shown = []; }, 150);
            }
          }
          if (shown.length > 0) show([...shown], []);
        } else {
          interim = words;
          show([...shown], interim);
        }
      }
    };

    r.onerror = e => { if (e.error !== "no-speech") setTimeout(() => r.start(), 800); };
    r.onend   = ()  => setTimeout(() => r.start(), 200);
    r.start();
  }
</script>
</body>
</html>
